# Obscura: one command to run your own post-quantum E2EE messenger.
#
#   Local / LAN:   docker compose up -d                 -> http://localhost:8080
#   Public HTTPS:  DOMAIN=chat.example.com docker compose --profile https up -d
#                  (point the domain's DNS at this machine first; Caddy gets a
#                  Let's Encrypt certificate automatically)
services:
  obscura:
    build: .
    image: obscura:1.0.0
    restart: unless-stopped
    ports:
      - "${OBSCURA_PORT:-8080}:8080"
    environment:
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      HSTS: "${HSTS:-0}"
      MAX_BLOB_MB: "105"
      ENVELOPE_TTL_DAYS: "30"
      BLOB_TTL_DAYS: "14"
    volumes:
      - obscura-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    profiles: ["https"]
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [obscura]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  obscura-data:
  caddy-data:
  caddy-config:
